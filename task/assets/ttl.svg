<svg xmlns="http://www.w3.org/2000/svg" width="1500" height="520" viewBox="0 0 1500 520"><rect width="1500" height="520" fill="white"/><style>text{font-family:DejaVu Sans,Arial,sans-serif;fill:#202124}.n{fill:#fff;stroke:#5f6368;stroke-width:3}.l{stroke:#747b83;stroke-width:5}.h{font-size:30px;font-weight:700}.t{font-size:22px;font-weight:700}.s{font-size:17px;fill:#5f6368}.p{fill:#1a73e8}@keyframes p{0%{transform:translate(170px,220px)}30%{transform:translate(550px,220px)}60%{transform:translate(950px,220px)}90%{transform:translate(1330px,220px)}92%{opacity:0}93%,99%{transform:translate(170px,220px);opacity:0}100%{transform:translate(170px,220px);opacity:1}}.packet{animation:p 9s linear infinite}</style><text class="h" x="750" y="50" text-anchor="middle">TTL уменьшается на каждом router hop</text><line class="l" x1="260" y1="220" x2="470" y2="220"/><line class="l" x1="630" y1="220" x2="870" y2="220"/><line class="l" x1="1030" y1="220" x2="1240" y2="220"/><rect class="n" x="80" y="165" width="180" height="110" rx="18"/><rect class="n" x="470" y="150" width="160" height="140" rx="18"/><rect class="n" x="870" y="150" width="160" height="140" rx="18"/><rect class="n" x="1240" y="165" width="180" height="110" rx="18"/><text class="t" x="170" y="215" text-anchor="middle">pc1</text><text class="t" x="550" y="215" text-anchor="middle">r1</text><text class="t" x="950" y="215" text-anchor="middle">r2</text><text class="t" x="1330" y="215" text-anchor="middle">pc2</text><g class="packet"><rect class="p" x="-35" y="-22" width="70" height="44" rx="8"/></g><text class="s" x="350" y="340" text-anchor="middle">TTL=3</text><text class="s" x="750" y="340" text-anchor="middle">после R1: TTL=2</text><text class="s" x="1130" y="340" text-anchor="middle">после R2: TTL=1</text><text class="s" x="750" y="430" text-anchor="middle">TTL=1/2 истекает раньше и вызывает ICMP Time Exceeded.</text></svg>